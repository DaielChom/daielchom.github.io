summary:
  # Versión corta para PDF (máximo 3 líneas)
  short:
    es: >-
      Ingeniero de Datos con más de 6 años de experiencia en analítica de datos, 
      inteligencia artificial y desarrollo de pipelines ETL. Especializado en 
      Python, SQL, y plataformas cloud. Apasionado por el machine learning y 
      los modelos generativos.
    en: >-
      Data Engineer with 6+ years of experience in data analytics, artificial 
      intelligence, and ETL pipeline development. Specialized in Python, SQL, 
      and cloud platforms. Passionate about machine learning and generative models.
  
  # Versión completa para la web
  full:
    es: >-
      He enfocado mi carrera en analítica de datos e inteligencia artificial 
      a través de diferentes estudios y experiencia laboral. Apoyo el software 
      libre y en mis tiempos libres suelo dibujar. Soy oriundo de Aguazul - 
      Casanare, me gusta el joropo y la tierra llanera. Me considero responsable 
      y la puntualidad es muy importante para mí.
    en: >-
      I have focused my career in data science and artificial intelligence 
      through different studies and work experience. I support free software 
      and in my free time, I usually draw. I am a native of Aguazul - Casanare, 
      I like the joropo, the Orinoquía region, and their culture. I consider 
      myself responsible and punctuality is very important to me.

