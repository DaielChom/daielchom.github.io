      actively participated in enterprise Data Warehouse design and construction across industries 
      (retail, fintech, trading), predictive model implementation, and technical decision-making 
      in multidisciplinary teams. Published researcher on generative models (GANs) applied to 
      trading in Research in International Business and Finance. Expert in Python, SQL, Linux, 
      GCP, AWS, and Databricks. Focused on OOP, clean code, and development best practices.

