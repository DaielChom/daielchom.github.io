# GitHub Actions workflow to build and deploy to GitHub Pages
# Triggers on pushes to main branch

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PDFs
        run: npm run pdf:all

      - name: Build project
        run: npm run build

      - name: Copy YAML data files to dist
        run: |
          mkdir -p dist/data
          cp src/data/*.yaml dist/data/

      - name: Copy images to dist
        run: |
          mkdir -p dist/images
          cp -r public/images/* dist/images/ 2>/dev/null || true

      - name: Copy certificates to dist
        run: |
          mkdir -p dist/certificates
          cp -r public/certificates/* dist/certificates/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

